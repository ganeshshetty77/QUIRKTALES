<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fanfic Library - VeggieFics</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: white;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 1rem;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            background-color: #1e293b;
            border-radius: 8px;
            margin-bottom: 2rem;
        }
        .logo {
            display: flex;
            align-items: center;
            font-weight: 700;
            font-size: 1.5rem;
            gap: 0.5rem;
            text-decoration: none;
            color: white;
        }
        .back-btn {
            background-color: #6366f1;
            color: white;
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s ease-in-out;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .back-btn:hover {
            background-color: #4f46e5;
        }
        .fanfic-item {
            background-color: #1e293b;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            transition: transform 0.2s ease;
        }
        .fanfic-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
        }
        .fanfic-title {
            margin-bottom: 0.5rem;
            font-size: 1.25rem;
            font-weight: 600;
            color: #e2e8f0;
        }
        .fanfic-summary {
            margin: 0.5rem 0;
            display: none;
            color: #94a3b8;
            line-height: 1.5;
            padding: 0.5rem 0;
        }
        .fanfic-actions {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }
        .toggle-summary {
            background-color: #334155;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 0.875rem;
            transition: background-color 0.2s ease;
        }
        .toggle-summary:hover {
            background-color: #475569;
        }
        .read-btn {
            background-color: #6366f1;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 500;
            transition: background-color 0.2s ease;
        }
        .read-btn:hover {
            background-color: #4f46e5;
        }
        .loading {
            text-align: center;
            padding: 2rem;
            color: #94a3b8;
        }
        .error {
            text-align: center;
            padding: 2rem;
            color: #ef4444;
            background-color: #1e293b;
            border-radius: 8px;
            margin: 1rem 0;
        }
    </style>
</head>
<body>
    <header class="container header">
        <a href="index.html" class="logo">
            <span>📺</span> VeggieFics
        </a>
        <a href="index.html" class="back-btn"><span>←</span> Back to Home</a>
    </header>
    <main class="container">
        <h1>Fanfic Library</h1>
        <div id="fanficList">
            <div class="loading">Loading fanfics...</div>
        </div>
    </main>
    <script>
        // Fallback data in case JSON file fails to load
        const fallbackFanfics = [
            {
                id: 0,
                title: 'The Vegetable War',
                summary: 'Carrot and Broccoli battle in the garden.',
                chapters: [
                    "Chapter 1: Overflow (Simpler Language)\n\nThe sun was setting over Dagobah Beach, painting the sky orange and red. The beach wasn't sandy and nice; it was covered in huge piles of old, broken things – rusty cars, smashed fridges, tangled wires. It looked like a giant junk yard. In one small area that had been cleared, two people stood facing each other.\n\nOne was All Might. Even though he looked thin and weak now, not like his strong hero form, he still felt important. He stood tall. The other was Izuku Midoriya, a boy with messy green hair. Izuku was shaking. He felt amazed to be near his hero, but also scared and very, very tired. He had worked incredibly hard for ten months to get ready for this moment. Sweat stuck his hair to his forehead.\n\n\"Midoriya, my boy,\" All Might said. His voice wasn't loud and booming like usual, but it was serious and heavy. \"This power, One For All, isn't just strength. It's like a torch, passed from one person to another to fight the darkness. It holds the wishes and sacrifices of everyone who had it before.\" He looked straight into Izuku's wide eyes. \"Now, it's yours. Hold out your hand.\"\n\nIzuku's heart pounded like a drum in his chest. *This is it!* He thought. All the pain, the broken bones, the endless work... it all led to this. His dream, held by his hero, was right there. *I'm going to be a hero! I won't let him down!* He reached out his hand. It shook badly. Everything else faded away – the junk piles, the sound of the ocean. All he saw was All Might and the single golden hair All Might held.\n\nThe hair, filled with the power of eight heroes before him, floated slowly down. It landed softly on Izuku's palm. A small shock, like a tiny spark, zipped up his arm. He felt it – the first touch of the huge power waiting inside. He braced himself, remembering how this power had broken his bones before.\n\nThen, the air *ripped* apart.\n\nIt wasn't a normal sound. It was a horrible tearing noise, like fabric being shredded, coming from behind a stack of old, rusty refrigerators about twenty meters away. A jagged hole, like a wound, hung in the air. Inside it swirled crazy, wild energies – sickly purple, bright green, and blinding white, crackling like bad lightning. Strange, whispering voices seemed to come from the hole, making the hair on Izuku's neck stand up. The light around it bent weirdly.\n\n\"*What—?!*\" All Might's head snapped towards the hole. His eyes widened in shock and worry. He moved instantly, putting himself between Izuku and the strange tear. He held out a hand like a shield. \"A villain's quirk? Teleportation? But this... this feels *wrong*. Like space itself is sick!\"\n\nBefore either could do anything else, the wild energy inside the hole lashed out. It wasn't aiming at them. It was like a dying animal thrashing. The chaotic energy whipped forward blindly.\n\nIt didn't hit All Might or Izuku. Instead, it crashed directly into the stream of power flowing from All Might *into* Izuku through the hair. One For All, a pure power of heroes, smashed into the wild, broken energy from the hole.\n\nThere was no loud bang. It was a silent disaster. The bright gold power and the crazy static mixed together violently. A blinding white flash exploded in front of Izuku's eyes. He didn't just see it; he *felt* it deep inside his bones and the place where his new power was settling. It wasn't just the huge, familiar pressure of One For All. Something else was forcing its way in. Something huge, old, and very much *aware*. It tangled up with his new power like roots digging into dirt. The feeling of this *other* thing was terrifying and overwhelming.\n\n*No!* Izuku panicked. *It's too much! This is wrong! All Might!* But the scream stayed trapped in his head as everything went dark.\n\n***\n\nAt the exact same moment, in a different world full of magic and monsters, Rimuru Tempest felt the familiar pull of teleportation. He was the Great Slime and a Demon Lord, traveling quickly from his city, Tempest, to a forest nearby. Magic flowed around him, carrying his slime body easily. He was thinking about trade deals with the Dwarves.\n\nSuddenly, the magic flow *snapped*.\n\nHe wasn't just stopped; he was violently ripped away. A huge, strange force, nothing like the magic he knew, yanked him off his path. It felt like being caught by a giant, invisible hook. There was no travel. Just the awful feeling of being torn apart and sucked into a whirlpool of screaming, crazy energy. His mind, usually calm, felt like it was tossed in a stormy sea. *What's happening?! A trap? Is it Clayman? No... this is too strong! It feels like the world is breaking! Great Sage! Help!*\n\nBut his trusted helper, the Great Sage, only sent back broken messages: [**Interference. Location Lost. Energy Unknown. Danger.**]\n\nThe wild energy from the rip in Izuku's world, mixed with the unstable power of the newly passed One For All, created a perfect storm. It needed somewhere to go, something to hold it. Rimuru's essence – his mind, his core, his very self – was thrown into this storm. He wasn't a whole slime anymore; he was like raw energy, ripped from his body. The storm found the only thing nearby that could hold such wild power: Izuku Midoriya, who was right then receiving One For All. Rimuru wasn't pulled *to* Izuku; he was smashed *into* him by a terrible accident across worlds.\n\n***\n\nIzuku didn't just fall down. He collapsed inward. The two floods – his new, messed-up One For All power and the huge, invading mind of Rimuru – crashed together inside him. His nerves screamed. It felt worse than any pain, like his body was being torn apart and rebuilt wrong. His eyes saw only blinding white or total blackness. He heard All Might yell, \"*YOUNG MIDORIYA!*\" but it sounded muffled and far away, like through a long tunnel.\n\nThe world spun. The red sky and All Might's shape blurred. He felt rough sand against his cheek. Then, thick, heavy darkness swallowed him completely. He passed out.\n\nSilence. Deep and total.\n\nThen, in the blackness inside his mind, a voice spoke. Not to his ears, but right inside his thoughts. It sounded calm, but underneath was deep confusion and a rising fear that matched Izuku's own panic.\n\n*\"...Figuring things out. Mixing with local power... partly worked? This power... 'One For All'. The person... 'Izuku Midoriya'. Place... Earth? Heroes and Quirks? Mistake. Big mistake. Where am I? Body... not working right. Senses... messed up. Thinking...\"* A pause filled with scary emptiness. *\"Hello? Can... can anyone hear me? What... what just happened?\"*\n\nThe voice – Rimuru's voice – hung alone in the darkness of Izuku's unconscious mind. The beach, the setting sun, All Might shouting for help on the phone beside Izuku's fallen body, the fading tear in the air... Izuku knew none of it. There was only darkness, the strange new power buzzing inside him – a mix of One For All and something else – and the lost, frightened mind of the Great Demon Lord Rimuru Tempest, trapped inside the head of a boy who had just wanted to be a hero. Their story started not with a cheer, but with the sound of the world ripping open.",
                    'Chapter 2: Tensions grow between the vegetables...',
                    'Chapter 3: Peace returns as the vegetables learn to coexist.'
                ]
            },
            {
                id: 1,
                title: 'Cabbage Hero',
                summary: 'A heroic cabbage saves the day.',
                chapters: [
                    'Chapter 1: A humble beginning for the cabbage hero.',
                    'Chapter 2: The villainous rabbit appears.',
                    'Chapter 3: Triumph of the cabbage hero.'
                ]
            }
        ];

        async function loadLibrary() {
            const list = document.getElementById('fanficList');
            let fanfics = [];
            
            try {
                console.log('Attempting to fetch fanfics.json...');
                const response = await fetch('fanfics.json');
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                fanfics = await response.json();
                console.log('Successfully loaded fanfics from JSON:', fanfics);
                
            } catch (err) {
                console.error('Failed to load fanfics.json, using fallback data.', err);
                fanfics = fallbackFanfics;
                
                // Show a warning message
                list.innerHTML = `
                    <div class="error">
                        <p><strong>Note:</strong> Could not load fanfics.json file. Using sample data instead.</p>
                        <p>Error: ${err.message}</p>
                    </div>
                `;
            }
            
            // Clear the loading message
            if (fanfics.length > 0) {
                list.innerHTML = '';
            }
            
            // Create fanfic items
            fanfics.forEach((fic) => {
                const item = document.createElement('div');
                item.className = 'fanfic-item';
                item.innerHTML = `
                    <h2 class="fanfic-title">${escapeHtml(fic.title)}</h2>
                    <button class="toggle-summary">Show Summary</button>
                    <p class="fanfic-summary">${escapeHtml(fic.summary)}</p>
                    <div class="fanfic-actions">
                        <button class="read-btn" data-id="${fic.id}">Read Fanfic</button>
                    </div>
                `;
                
                // Add event listener for summary toggle
                const toggleBtn = item.querySelector('.toggle-summary');
                const summary = item.querySelector('.fanfic-summary');
                
                toggleBtn.addEventListener('click', (e) => {
                    if (summary.style.display === 'none' || summary.style.display === '') {
                        summary.style.display = 'block';
                        e.target.textContent = 'Hide Summary';
                    } else {
                        summary.style.display = 'none';
                        e.target.textContent = 'Show Summary';
                    }
                });
                
                // Add event listener for read button
                const readBtn = item.querySelector('.read-btn');
                readBtn.addEventListener('click', () => {
                    window.location.href = `fanfic_reader.html?id=${fic.id}`;
                });
                
                list.appendChild(item);
            });
            
            // If no fanfics were loaded, show an error
            if (fanfics.length === 0) {
                list.innerHTML = `
                    <div class="error">
                        <p>No fanfics available at the moment.</p>
                        <p>Please try again later or check if the fanfics.json file exists.</p>
                    </div>
                `;
            }
        }
        
        // Helper function to escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Load library when page is ready
        document.addEventListener('DOMContentLoaded', loadLibrary);
    </script>
</body>
</html>
