<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fanfic Reader - VeggieFics</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: white;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 1rem;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            background-color: #1e293b;
            border-radius: 8px;
            margin-bottom: 2rem;
        }
        .logo {
            display: flex;
            align-items: center;
            font-weight: 700;
            font-size: 1.5rem;
            gap: 0.5rem;
            text-decoration: none;
            color: white;
        }
        .back-btn {
            background-color: #6366f1;
            color: white;
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s ease-in-out;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .back-btn:hover {
            background-color: #4f46e5;
        }
        #chapterContent {
            white-space: pre-wrap;
            margin-bottom: 1rem;
        }
        .nav-buttons button {
            background-color: #6366f1;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            margin-right: 0.5rem;
            border-radius: 0.5rem;
            cursor: pointer;
        }
        .nav-buttons button:hover {
            background-color: #4f46e5;
        }
    </style>
</head>
<body>
    <header class="container header">
        <a href="fanfics.html" class="logo">
            <span>📺</span> VeggieFics
        </a>
        <a href="fanfics.html" class="back-btn"><span>←</span> Back to Library</a>
    </header>
    <main class="container">
        <h1 id="fanficTitle"></h1>
        <div id="chapterContent"></div>
        <div class="nav-buttons">
            <button id="prevBtn">Previous</button>
            <button id="nextBtn">Next</button>
            <button id="lastBtn">Last</button>
        </div>
    </main>
    <script>
        const params = new URLSearchParams(window.location.search);
        const id = parseInt(params.get('id'), 10) || 0;
        const fallbackFanfics = [
            {
                id: 0,
                title: 'Fusion With RImuru',
                summary: 'Izuku Midoriya was ready to inherit One For All—until the world tore open. A rift between dimensions unleashes wild, alien energy mid-transfer, and with it, the disembodied essence of a powerful Demon Lord: Rimuru Tempest. Now, the legacy of heroes collides with the soul of a reincarnated slime. One For All is no longer just a torch—it’s a storm of quirks, magic, and monstrous potential. As Izuku battles to control his mutated powers, whispers of strange rifts and impossible creatures begin to ripple through the city. U.A. sees him as unstable. His classmates begin to fear him. And inside his mind, Rimuru watches, analyzes, and remembers a world that no longer exists. Two souls. One body. And a fusion no one can explain.',
                chapters: [
                   "Chapter 1: Overflow \n\nThe sun was setting over Dagobah Beach, painting the sky orange and red. The beach wasn't sandy and nice; it was covered in huge piles of old, broken things – rusty cars, smashed fridges, tangled wires. It looked like a giant junk yard. In one small area that had been cleared, two people stood facing each other.\n\nOne was All Might. Even though he looked thin and weak now, not like his strong hero form, he still felt important. He stood tall. The other was Izuku Midoriya, a boy with messy green hair. Izuku was shaking. He felt amazed to be near his hero, but also scared and very, very tired. He had worked incredibly hard for ten months to get ready for this moment. Sweat stuck his hair to his forehead.\n\n\"Midoriya, my boy,\" All Might said. His voice wasn't loud and booming like usual, but it was serious and heavy. \"This power, One For All, isn't just strength. It's like a torch, passed from one person to another to fight the darkness. It holds the wishes and sacrifices of everyone who had it before.\" He looked straight into Izuku's wide eyes. \"Now, it's yours. Hold out your hand.\"\n\nIzuku's heart pounded like a drum in his chest. *This is it!* He thought. All the pain, the broken bones, the endless work... it all led to this. His dream, held by his hero, was right there. *I'm going to be a hero! I won't let him down!* He reached out his hand. It shook badly. Everything else faded away – the junk piles, the sound of the ocean. All he saw was All Might and the single golden hair All Might held.\n\nThe hair, filled with the power of eight heroes before him, floated slowly down. It landed softly on Izuku's palm. A small shock, like a tiny spark, zipped up his arm. He felt it – the first touch of the huge power waiting inside. He braced himself, remembering how this power had broken his bones before.\n\nThen, the air *ripped* apart.\n\nIt wasn't a normal sound. It was a horrible tearing noise, like fabric being shredded, coming from behind a stack of old, rusty refrigerators about twenty meters away. A jagged hole, like a wound, hung in the air. Inside it swirled crazy, wild energies – sickly purple, bright green, and blinding white, crackling like bad lightning. Strange, whispering voices seemed to come from the hole, making the hair on Izuku's neck stand up. The light around it bent weirdly.\n\n\"*What—?!*\" All Might's head snapped towards the hole. His eyes widened in shock and worry. He moved instantly, putting himself between Izuku and the strange tear. He held out a hand like a shield. \"A villain's quirk? Teleportation? But this... this feels *wrong*. Like space itself is sick!\"\n\nBefore either could do anything else, the wild energy inside the hole lashed out. It wasn't aiming at them. It was like a dying animal thrashing. The chaotic energy whipped forward blindly.\n\nIt didn't hit All Might or Izuku. Instead, it crashed directly into the stream of power flowing from All Might *into* Izuku through the hair. One For All, a pure power of heroes, smashed into the wild, broken energy from the hole.\n\nThere was no loud bang. It was a silent disaster. The bright gold power and the crazy static mixed together violently. A blinding white flash exploded in front of Izuku's eyes. He didn't just see it; he *felt* it deep inside his bones and the place where his new power was settling. It wasn't just the huge, familiar pressure of One For All. Something else was forcing its way in. Something huge, old, and very much *aware*. It tangled up with his new power like roots digging into dirt. The feeling of this *other* thing was terrifying and overwhelming.\n\n*No!* Izuku panicked. *It's too much! This is wrong! All Might!* But the scream stayed trapped in his head as everything went dark.\n\n***\n\nAt the exact same moment, in a different world full of magic and monsters, Rimuru Tempest felt the familiar pull of teleportation. He was the Great Slime and a Demon Lord, traveling quickly from his city, Tempest, to a forest nearby. Magic flowed around him, carrying his slime body easily. He was thinking about trade deals with the Dwarves.\n\nSuddenly, the magic flow *snapped*.\n\nHe wasn't just stopped; he was violently ripped away. A huge, strange force, nothing like the magic he knew, yanked him off his path. It felt like being caught by a giant, invisible hook. There was no travel. Just the awful feeling of being torn apart and sucked into a whirlpool of screaming, crazy energy. His mind, usually calm, felt like it was tossed in a stormy sea. *What's happening?! A trap? Is it Clayman? No... this is too strong! It feels like the world is breaking! Great Sage! Help!*\n\nBut his trusted helper, the Great Sage, only sent back broken messages: [**Interference. Location Lost. Energy Unknown. Danger.**]\n\nThe wild energy from the rip in Izuku's world, mixed with the unstable power of the newly passed One For All, created a perfect storm. It needed somewhere to go, something to hold it. Rimuru's essence – his mind, his core, his very self – was thrown into this storm. He wasn't a whole slime anymore; he was like raw energy, ripped from his body. The storm found the only thing nearby that could hold such wild power: Izuku Midoriya, who was right then receiving One For All. Rimuru wasn't pulled *to* Izuku; he was smashed *into* him by a terrible accident across worlds.\n\n***\n\nIzuku didn't just fall down. He collapsed inward. The two floods – his new, messed-up One For All power and the huge, invading mind of Rimuru – crashed together inside him. His nerves screamed. It felt worse than any pain, like his body was being torn apart and rebuilt wrong. His eyes saw only blinding white or total blackness. He heard All Might yell, \"*YOUNG MIDORIYA!*\" but it sounded muffled and far away, like through a long tunnel.\n\nThe world spun. The red sky and All Might's shape blurred. He felt rough sand against his cheek. Then, thick, heavy darkness swallowed him completely. He passed out.\n\nSilence. Deep and total.\n\nThen, in the blackness inside his mind, a voice spoke. Not to his ears, but right inside his thoughts. It sounded calm, but underneath was deep confusion and a rising fear that matched Izuku's own panic.\n\n*\"...Figuring things out. Mixing with local power... partly worked? This power... 'One For All'. The person... 'Izuku Midoriya'. Place... Earth? Heroes and Quirks? Mistake. Big mistake. Where am I? Body... not working right. Senses... messed up. Thinking...\"* A pause filled with scary emptiness. *\"Hello? Can... can anyone hear me? What... what just happened?\"*\n\nThe voice – Rimuru's voice – hung alone in the darkness of Izuku's unconscious mind. The beach, the setting sun, All Might shouting for help on the phone beside Izuku's fallen body, the fading tear in the air... Izuku knew none of it. There was only darkness, the strange new power buzzing inside him – a mix of One For All and something else – and the lost, frightened mind of the Great Demon Lord Rimuru Tempest, trapped inside the head of a boy who had just wanted to be a hero. Their story started not with a cheer, but with the sound of the world ripping open.",
                    "Chapter 2: Two Souls, One Core\n\nThe world returned in fragments. First, a sterile, antiseptic smell that stung Izuku’s nose. Then, the muffled hum of fluorescent lights vibrating overhead. A dull ache pulsed through his entire body, centered deep within his bones and radiating outwards. He felt… hollowed out, yet somehow overflowing, a jarring contradiction that made his stomach lurch. His eyelids felt glued shut, heavy with exhaustion and the lingering residue of… what? That blinding light? The tearing sound? The *otherness*?\n\nHe forced his eyes open, blinking against the harsh light. White ceiling tiles swam into focus. He was lying on a firm bed, covered by a thin, scratchy blanket. The familiar, comforting-yet-slightly-intimidating sight of Recovery Girl’s office at U.A. High School surrounded him. Relief warred with a deeper, more profound confusion. *All Might… the beach… the power… that rip… the voice…*\n\nPanic flared. He tried to sit up, but a wave of dizziness slammed him back against the pillow. His body screamed in protest, muscles trembling with weakness. He felt utterly drained, like he’d run a hundred marathons while simultaneously being hit by a truck.\n\n“Ah, you’re awake, young man.” Recovery Girl’s voice, gentle but laced with professional concern, cut through the buzzing in his ears. She bustled into his field of vision, her small form dwarfed by the medical equipment nearby. “How are you feeling? Any sharp pains? Nausea?”\n\n“R-Recovery Girl?” Izuku croaked, his throat dry and raw. “What… what happened? All Might… is he…?”\n\n“All Might is fine, dearie,” she assured him, patting his hand. Her touch was cool and reassuring. “A little shaken, understandably. He brought you straight here after you collapsed on the beach. He’s been pacing outside like a worried father for hours.” She adjusted the IV line taped to his arm. “You gave everyone quite a scare. Severe quirk exhaustion, massive energy drain… and something else.” Her eyes, sharp and perceptive behind her glasses, studied him intently. “Your vitals were… chaotic when you arrived. Stabilizing now, but it was unlike any quirk exhaustion I’ve seen related to One For All’s initial transfer. All Might described a strange spatial disturbance?”\n\nThe beach incident flooded back – the golden hair landing, the terrifying rip in the air, the clash of energies, the overwhelming *invasion*, the voice in the dark. He shuddered. “Y-yes. There was… a hole. Like a tear. It had… weird energy. It hit me just as… just as the power…” He trailed off, unable to articulate the sheer violation and terror of that moment, the feeling of something vast and alien forcing its way *in*.\n\n“Mm,” Recovery Girl hummed, her expression thoughtful. “All Might mentioned that. He’s reporting it to Nezu and the police. Unstable teleportation quirks are dangerous, but this sounded… different.” She checked his pulse. “Rest is the best medicine for now. Your body needs time to integrate the power and recover from the shock. I’ve administered fluids and nutrients. Sleep, Midoriya.”\n\nShe dimmed the lights slightly and shuffled away, leaving Izuku alone with the hum of machines and the frantic whirlwind of his thoughts.\n\n*Integrate the power?* The thought was terrifying. Because it wasn’t *just* One For All anymore. That immense, heroic energy was there, a dormant furnace deep within his core, but tangled with it was… something else. Something sentient. The *voice*.\n\n*Hello?* The thought formed hesitantly, tentatively, in the quiet of his mind. *Can… can you hear me? Are you still there?*\n\nSilence. Thick, oppressive silence. Maybe it had been a hallucination? A side effect of the trauma? Wishful thinking? But the memory was too vivid, too real. The calm confusion, the underlying fear that had mirrored his own panic.\n\nHe closed his eyes, trying to focus inward, past the bone-deep fatigue. He sought the familiar, terrifying wellspring of One For All, the power that had shattered his limbs. It was there, vast and powerful, but… altered. Swirling within it, woven into its very fabric like iridescent threads in dark velvet, was another presence. It felt ancient, powerful, yet strangely… contained? And then, he felt a faint, sticky sensation on his cheek where it pressed against the pillow.\n\nHe reached up slowly, wincing at the protest of his muscles. His fingers touched his skin. It felt… damp? Cool? Not sweat. He pulled his hand back. His fingertips glistened with a faintly luminescent, translucent blue-green slime. It vanished almost instantly, absorbed back into his skin, leaving no trace but a lingering coolness.\n\nHis breath hitched. *What was that?!*\n\n*Ah… tactile feedback re-established. Partial physical interaction confirmed.* The voice echoed suddenly, clear as a bell inside his head, making Izuku flinch violently. It wasn't heard; it was *felt*, resonating directly within his consciousness. It sounded male, young, and brimming with analytical curiosity, though an undercurrent of profound disorientation remained. *Subject: Izuku Midoriya. Location: Medical facility, likely Earth origin, \"Quirk\" society. Current status: Biological host experiencing severe energetic depletion. Observation: Localized slime secretion detected – likely instinctive regenerative response triggered by host stress. Fascinating.*\n\nIzuku’s heart hammered against his ribs. It *was* real. He wasn’t crazy. There was someone… something… *inside* him. “Who… who are you?” he whispered aloud, his voice trembling.\n\n*Internal vocalization detected. Communication attempt recognized.* The voice paused, processing. *Identification: Designation Rimuru Tempest. Former Status: Great Demon Lord, Ruler of the Jura Tempest Federation. Current Status:… Uncertain. Analysis indicates non-corporeal consciousness merged with host biological system and integrated local energy source designated \"One For All\". Significant dimensional translocation event confirmed. Cause: Collision of unstable spatial anomaly with nascent power transfer. Consequence: Spiritual and energetic fusion.*\n\nThe words washed over Izuku, each one more unbelievable than the last. *Great Demon Lord? Ruler? Dimensional translocation? Fusion?* It sounded like something out of one of his old hero analysis notebooks crossed with a fantasy light novel. Fear warred with an almost overwhelming geeky curiosity. “D-Demon Lord?” he squeaked.\n\n*Correction: Former Demon Lord,* Rimuru’s mental voice held a hint of dry amusement. *Current designation irrelevant. Primary concern: Stabilization. Host biological integrity is paramount. This \"One For All\" energy… it's potent but volatile. The fusion event created… turbulence. My core is attempting integration, but the energies are resisting harmonization. Your body is the battleground.*\n\nAs if on cue, a sharp, stabbing pain lanced through Izuku’s forearm. He gasped, clutching it. Beneath the skin, he saw a faint, brief flicker of that same blue-green light, like a trapped firefly. It faded quickly, leaving only the ache.\n\n*Observed: Energy feedback loop. My restorative abilities are attempting to heal cellular strain caused by One For All's residual instability, but the power itself reacts defensively. Inefficient. Dangerous.* Rimuru’s tone shifted, becoming more focused, urgent. *Izuku Midoriya. We need to establish a stable mental link. Direct communication is inefficient and taxing for you. May I attempt deeper synchronization?*\n\n“D-deeper?” Izuku stammered, the fear spiking again. “What does that mean? Are you going to… take over?” Images of body-snatching villains flashed through his mind.\n\n*Negative!* Rimuru’s response was swift and firm, carrying a surprising weight of sincerity. *Assumption of direct control is undesirable and currently impossible without catastrophic damage to your psyche and this fragile fusion. My core is embedded within One For All; separation is currently non-viable. Synchronization means shared awareness, streamlined communication, potentially coordinated energy management. Think of it as… opening a secure channel. I cannot act without your will, but I can perceive and advise. It is necessary for our mutual survival and understanding.*\n\nIzuku took shaky breaths, trying to calm his racing heart. The pain in his arm was a stark reminder of the danger. The slime secretion, the voice… it was undeniable. This being, Rimuru, was part of him now. Hiding from it wouldn’t help. All Might’s words echoed: *It’s like a torch, passed from one person to another to fight the darkness.* Was this… part of that darkness? Or something else entirely? Rimuru hadn’t attacked; he’d analyzed, explained, and expressed concern for *his* body.\n\n“O-okay,” Izuku whispered, closing his eyes tightly. “Do it. Synchronize.”\n\n*Acknowledgement. Initiating Neural Synchronization Protocol. Warning: Initial contact may cause disorientation.*\n\nThere was no sound, no flash. Instead, Izuku’s perception *shifted*. It was like suddenly having a second set of senses layered over his own, but inward-focused. He *felt* the vast, swirling ocean of One For All, a tempest of raw, inherited power. And nestled within its heart, like a brilliant, multifaceted gemstone radiating cool, calming light, was Rimuru’s core. Tendrils of blue-green energy, gentle yet persistent, extended from the core, trying to weave themselves into the raging golden currents of OFA, soothing frayed edges, reinforcing weak points, but meeting resistance.\n\n*Perception established. This is… remarkable.* Rimuru’s voice wasn’t just in his head now; it was *part* of his internal landscape, calm and observing. *The complexity of One For All… it carries echoes. Seven, no, eight distinct signatures intertwined with the core power. Vestiges of past wielders. And the instability… it’s not just new-user strain. The dimensional collision created microfractures in its energetic matrix. My presence is acting as a… patch, but a temporary one.*\n\nIzuku could *see* it in his mind’s eye – the golden power riddled with hairline cracks of chaotic purple and green energy, the blue-green light of Rimuru sealing them, but new cracks appearing elsewhere. It was a constant, delicate repair job. “Is… is that why I hurt?” he thought, the communication effortless now.\n\n*Affirmative. The power leaks cause cellular stress. My regeneration counters it, but it’s a reactive measure, not a cure. Furthermore…* Rimuru’s focus shifted. *My core isn’t just patching; it’s integrating. Analyzing. The fusion is creating… mutations.*\n\n“Mutations?” Dread pooled in Izuku’s stomach.\n\n*Accessing passive skills. [Magic Sense] online. Range limited to host physiology and immediate vicinity. [Analyze and Assess] online. Scanning…* Izuku felt a cool, analytical wave sweep through him. *Host biology exhibits enhanced cellular regeneration baseline, approximately 300% above human normal, fueled by my slime essence. Skeletal and muscular density show slight increase, likely adaptation to OFA’s potential. Neural pathways… fascinating. Increased processing speed and sensory acuity detected. Synergy potential with One For All’s physical enhancement is significant. However…*\n\n“However?” Izuku prompted nervously.\n\n*However, the fusion has unlocked latent aspects of *my* capabilities within the OFA matrix. Specifically, the Predator skill tree – Absorption, Mimicry, Isolation. They are dormant but… integrated. Accessible, theoretically, through One For All’s conduit: your body.*\n\nIzuku’s mind reeled. Absorption? Mimicry? Those sounded terrifyingly powerful… and potentially monstrous. “Can I… control them?”\n\n*Unknown. Theoretical activation requires significant energy expenditure and conscious intent, likely channeled *through* One For All. Risk of uncontrolled manifestation exists, especially under stress. Caution is paramount.*\n\nBefore Izuku could process this further, the door to the infirmary swung open. All Might stood there, still in his skeletal form, his face etched with deep worry that softened into profound relief when he saw Izuku awake. “Young Midoriya!” He hurried to the bedside, his large hand gently resting on Izuku’s shoulder. “Thank goodness. How are you feeling？”\n\n# truncated for brevity due to length\n",
                    'Chapter 3: Peace returns as the vegetables learn to coexist.'
                ]
            },
            {
                id: 1,
                title: 'Cabbage Hero',
                summary: 'A heroic cabbage saves the day.',
                chapters: [
                    'Chapter 1: A humble beginning for the cabbage hero.',
                    'Chapter 2: The villainous rabbit appears.',
                    'Chapter 3: Triumph of the cabbage hero.'
                ]
            }
        ];
        let chapters = [];
        let current = 0;

        async function loadFanfic() {
            let fanfics = [];
            try {
                const response = await fetch('fanfics.json');
                if (!response.ok) throw new Error('HTTP error');
                fanfics = await response.json();
            } catch (err) {
                console.error('Failed to load fanfics.json, using fallback data.', err);
                fanfics = fallbackFanfics;
            }
            const fic = fanfics.find(f => f.id === id);
            if (!fic) return;
            document.getElementById('fanficTitle').textContent = fic.title;
            chapters = fic.chapters;
            renderChapter();
        }

        function renderChapter() {
            document.getElementById('chapterContent').textContent = chapters[current];
        }

        document.getElementById('prevBtn').addEventListener('click', () => {
            if (current > 0) {
                current--;
                renderChapter();
            }
        });
        document.getElementById('nextBtn').addEventListener('click', () => {
            if (current < chapters.length - 1) {
                current++;
                renderChapter();
            }
        });
        document.getElementById('lastBtn').addEventListener('click', () => {
            current = chapters.length - 1;
            renderChapter();
        });

        document.addEventListener('DOMContentLoaded', loadFanfic);
    </script>
</body>
</html>
