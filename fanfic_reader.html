        const fallbackFanfics = [
            {
                id: 0,
                title: 'Fusion With RImuru',
                summary: 'Izuku Midoriya was ready to inherit One For All—until the world tore open. A rift between dimensions unleashes wild, alien energy mid-transfer, and with it, the disembodied essence of a powerful Demon Lord: Rimuru Tempest. Now, the legacy of heroes collides with the soul of a reincarnated slime. One For All is no longer just a torch—it’s a storm of quirks, magic, and monstrous potential. As Izuku battles to control his mutated powers, whispers of strange rifts and impossible creatures begin to ripple through the city. U.A. sees him as unstable. His classmates begin to fear him. And inside his mind, Rimuru watches, analyzes, and remembers a world that no longer exists. Two souls. One body. And a fusion no one can explain.',
                chapters: [
                   "Chapter 1: Overflow \n\nThe sun was setting over Dagobah Beach, painting the sky orange and red. The beach wasn't sandy and nice; it was covered in huge piles of old, broken things – rusty cars, smashed fridges, tangled wires. It looked like a giant junk yard. In one small area that had been cleared, two people stood facing each other.\n\nOne was All Might. Even though he looked thin and weak now, not like his strong hero form, he still felt important. He stood tall. The other was Izuku Midoriya, a boy with messy green hair. Izuku was shaking. He felt amazed to be near his hero, but also scared and very, very tired. He had worked incredibly hard for ten months to get ready for this moment. Sweat stuck his hair to his forehead.\n\n\"Midoriya, my boy,\" All Might said. His voice wasn't loud and booming like usual, but it was serious and heavy. \"This power, One For All, isn't just strength. It's like a torch, passed from one person to another to fight the darkness. It holds the wishes and sacrifices of everyone who had it before.\" He looked straight into Izuku's wide eyes. \"Now, it's yours. Hold out your hand.\"\n\nIzuku's heart pounded like a drum in his chest. *This is it!* He thought. All the pain, the broken bones, the endless work... it all led to this. His dream, held by his hero, was right there. *I'm going to be a hero! I won't let him down!* He reached out his hand. It shook badly. Everything else faded away – the junk piles, the sound of the ocean. All he saw was All Might and the single golden hair All Might held.\n\nThe hair, filled with the power of eight heroes before him, floated slowly down. It landed softly on Izuku's palm. A small shock, like a tiny spark, zipped up his arm. He felt it – the first touch of the huge power waiting inside. He braced himself, remembering how this power had broken his bones before.\n\nThen, the air *ripped* apart.\n\nIt wasn't a normal sound. It was a horrible tearing noise, like fabric being shredded, coming from behind a stack of old, rusty refrigerators about twenty meters away. A jagged hole, like a wound, hung in the air. Inside it swirled crazy, wild energies – sickly purple, bright green, and blinding white, crackling like bad lightning. Strange, whispering voices seemed to come from the hole, making the hair on Izuku's neck stand up. The light around it bent weirdly.\n\n\"*What—?!*\" All Might's head snapped towards the hole. His eyes widened in shock and worry. He moved instantly, putting himself between Izuku and the strange tear. He held out a hand like a shield. \"A villain's quirk? Teleportation? But this... this feels *wrong*. Like space itself is sick!\"\n\nBefore either could do anything else, the wild energy inside the hole lashed out. It wasn't aiming at them. It was like a dying animal thrashing. The chaotic energy whipped forward blindly.\n\nIt didn't hit All Might or Izuku. Instead, it crashed directly into the stream of power flowing from All Might *into* Izuku through the hair. One For All, a pure power of heroes, smashed into the wild, broken energy from the hole.\n\nThere was no loud bang. It was a silent disaster. The bright gold power and the crazy static mixed together violently. A blinding white flash exploded in front of Izuku's eyes. He didn't just see it; he *felt* it deep inside his bones and the place where his new power was settling. It wasn't just the huge, familiar pressure of One For All. Something else was forcing its way in. Something huge, old, and very much *aware*. It tangled up with his new power like roots digging into dirt. The feeling of this *other* thing was terrifying and overwhelming.\n\n*No!* Izuku panicked. *It's too much! This is wrong! All Might!* But the scream stayed trapped in his head as everything went dark.\n\n***\n\nAt the exact same moment, in a different world full of magic and monsters, Rimuru Tempest felt the familiar pull of teleportation. He was the Great Slime and a Demon Lord, traveling quickly from his city, Tempest, to a forest nearby. Magic flowed around him, carrying his slime body easily. He was thinking about trade deals with the Dwarves.\n\nSuddenly, the magic flow *snapped*.\n\nHe wasn't just stopped; he was violently ripped away. A huge, strange force, nothing like the magic he knew, yanked him off his path. It felt like being caught by a giant, invisible hook. There was no travel. Just the awful feeling of being torn apart and sucked into a whirlpool of screaming, crazy energy. His mind, usually calm, felt like it was tossed in a stormy sea. *What's happening?! A trap? Is it Clayman? No... this is too strong! It feels like the world is breaking! Great Sage! Help!*\n\nBut his trusted helper, the Great Sage, only sent back broken messages: [**Interference. Location Lost. Energy Unknown. Danger.**]\n\nThe wild energy from the rip in Izuku's world, mixed with the unstable power of the newly passed One For All, created a perfect storm. It needed somewhere to go, something to hold it. Rimuru's essence – his mind, his core, his very self – was thrown into this storm. He wasn't a whole slime anymore; he was like raw energy, ripped from his body. The storm found the only thing nearby that could hold such wild power: Izuku Midoriya, who was right then receiving One For All. Rimuru wasn't pulled *to* Izuku; he was smashed *into* him by a terrible accident across worlds.\n\n***\n\nIzuku didn't just fall down. He collapsed inward. The two floods – his new, messed-up One For All power and the huge, invading mind of Rimuru – crashed together inside him. His nerves screamed. It felt worse than any pain, like his body was being torn apart and rebuilt wrong. His eyes saw only blinding white or total blackness. He heard All Might yell, \"*YOUNG MIDORIYA!*\" but it sounded muffled and far away, like through a long tunnel.\n\nThe world spun. The red sky and All Might's shape blurred. He felt rough sand against his cheek. Then, thick, heavy darkness swallowed him completely. He passed out.\n\nSilence. Deep and total.\n\nThen, in the blackness inside his mind, a voice spoke. Not to his ears, but right inside his thoughts. It sounded calm, but underneath was deep confusion and a rising fear that matched Izuku's own panic.\n\n*\"...Figuring things out. Mixing with local power... partly worked? This power... 'One For All'. The person... 'Izuku Midoriya'. Place... Earth? Heroes and Quirks? Mistake. Big mistake. Where am I? Body... not working right. Senses... messed up. Thinking...\"* A pause filled with scary emptiness. *\"Hello? Can... can anyone hear me? What... what just happened?\"*\n\nThe voice – Rimuru's voice – hung alone in the darkness of Izuku's unconscious mind. The beach, the setting sun, All Might shouting for help on the phone beside Izuku's fallen body, the fading tear in the air... Izuku knew none of it. There was only darkness, the strange new power buzzing inside him – a mix of One For All and something else – and the lost, frightened mind of the Great Demon Lord Rimuru Tempest, trapped inside the head of a boy who had just wanted to be a hero. Their story started not with a cheer, but with the sound of the world ripping open.",
                    "Chapter 2: Two Souls, One Core\n\nThe world returned in fragments. First, a sterile, antiseptic smell that stung Izuku’s nose. Then, the muffled hum of fluorescent lights vibrating overhead. A dull ache pulsed through his entire body, centered deep within his bones and radiating outwards. He felt… hollowed out, yet somehow overflowing, a jarring contradiction that made his stomach lurch. His eyelids felt glued shut, heavy with exhaustion and the lingering residue of… what? That blinding light? The tearing sound? The *otherness*?\n\nHe forced his eyes open, blinking against the harsh light. White ceiling tiles swam into focus. He was lying on a firm bed, covered by a thin, scratchy blanket. The familiar, comforting-yet-slightly-intimidating sight of Recovery Girl’s office at U.A. High School surrounded him. Relief warred with a deeper, more profound confusion. *All Might… the beach… the power… that rip… the voice…*\n\nPanic flared. He tried to sit up, but a wave of dizziness slammed him back against the pillow. His body screamed in protest, muscles trembling with weakness. He felt utterly drained, like he’d run a hundred marathons while simultaneously being hit by a truck.\n\n“Ah, you’re awake, young man.” Recovery Girl’s voice, gentle but laced with professional concern, cut through the buzzing in his ears. She bustled into his field of vision, her small form dwarfed by the medical equipment nearby. “How are you feeling? Any sharp pains? Nausea?”\n\n“R-Recovery Girl?” Izuku croaked, his throat dry and raw. “What… what happened? All Might… is he…?”\n\n“All Might is fine, dearie,” she assured him, patting his hand. Her touch was cool and reassuring. “A little shaken, understandably. He brought you straight here after you collapsed on the beach. He’s been pacing outside like a worried father for hours.” She adjusted the IV line taped to his arm. “You gave everyone quite a scare. Severe quirk exhaustion, massive energy drain… and something else.” Her eyes, sharp and perceptive behind her glasses, studied him intently. “Your vitals were… chaotic when you arrived. Stabilizing now, but it was unlike any quirk exhaustion I’ve seen related to One For All’s initial transfer. All Might described a strange spatial disturbance?”\n\nThe beach incident flooded back – the golden hair landing, the terrifying rip in the air, the clash of energies, the overwhelming *invasion*, the voice in the dark. He shuddered. “Y-yes. There was… a hole. Like a tear. It had… weird energy. It hit me just as… just as the power…” He trailed off, unable to articulate the sheer violation and terror of that moment, the feeling of something vast and alien forcing its way *in*.\n\n“Mm,” Recovery Girl hummed, her expression thoughtful. “All Might mentioned that. He’s reporting it to Nezu and the police. Unstable teleportation quirks are dangerous, but this sounded… different.” She checked his pulse. “Rest is the best medicine for now. Your body needs time to integrate the power and recover from the shock. I’ve administered fluids and nutrients. Sleep, Midoriya.”\n\nShe dimmed the lights slightly and shuffled away, leaving Izuku alone with the hum of machines and the frantic whirlwind of his thoughts.\n\n*Integrate the power?* The thought was terrifying. Because it wasn’t *just* One For All anymore. That immense, heroic energy was there, a dormant furnace deep within his core, but tangled with it was… something else. Something sentient. The *voice*.\n\n*Hello?* The thought formed hesitantly, tentatively, in the quiet of his mind. *Can… can you hear me? Are you still there?*\n\nSilence. Thick, oppressive silence. Maybe it had been a hallucination? A side effect of the trauma? Wishful thinking? But the memory was too vivid, too real. The calm confusion, the underlying fear that had mirrored his own panic.\n\nHe closed his eyes, trying to focus inward, past the bone-deep fatigue. He sought the familiar, terrifying wellspring of One For All, the power that had shattered his limbs. It was there, vast and powerful, but… altered. Swirling within it, woven into its very fabric like iridescent threads in dark velvet, was another presence. It felt ancient, powerful, yet strangely… contained? And then, he felt a faint, sticky sensation on his cheek where it pressed against the pillow.\n\nHe reached up slowly, wincing at the protest of his muscles. His fingers touched his skin. It felt… damp? Cool? Not sweat. He pulled his hand back. His fingertips glistened with a faintly luminescent, translucent blue-green slime. It vanished almost instantly, absorbed back into his skin, leaving no trace but a lingering coolness.\n\nHis breath hitched. *What was that?!*\n\n*Ah… tactile feedback re-established. Partial physical interaction confirmed.* The voice echoed suddenly, clear as a bell inside his head, making Izuku flinch violently. It wasn't heard; it was *felt*, resonating directly within his consciousness. It sounded male, young, and brimming with analytical curiosity, though an undercurrent of profound disorientation remained. *Subject: Izuku Midoriya. Location: Medical facility, likely Earth origin, \"Quirk\" society. Current status: Biological host experiencing severe energetic depletion. Observation: Localized slime secretion detected – likely instinctive regenerative response triggered by host stress. Fascinating.*\n\nIzuku’s heart hammered against his ribs. It *was* real. He wasn’t crazy. There was someone… something… *inside* him. “Who… who are you?” he whispered aloud, his voice trembling.\n\n*Internal vocalization detected. Communication attempt recognized.* The voice paused, processing. *Identification: Designation Rimuru Tempest. Former Status: Great Demon Lord, Ruler of the Jura Tempest Federation. Current Status:… Uncertain. Analysis indicates non-corporeal consciousness merged with host biological system and integrated local energy source designated \"One For All\". Significant dimensional translocation event confirmed. Cause: Collision of unstable spatial anomaly with nascent power transfer. Consequence: Spiritual and energetic fusion.*\n\nThe words washed over Izuku, each one more unbelievable than the last. *Great Demon Lord? Ruler? Dimensional translocation? Fusion?* It sounded like something out of one of his old hero analysis notebooks crossed with a fantasy light novel. Fear warred with an almost overwhelming geeky curiosity. “D-Demon Lord?” he squeaked.\n\n*Correction: Former Demon Lord,* Rimuru’s mental voice held a hint of dry amusement. *Current designation irrelevant. Primary concern: Stabilization. Host biological integrity is paramount. This \"One For All\" energy… it's potent but volatile. The fusion event created… turbulence. My core is attempting integration, but the energies are resisting harmonization. Your body is the battleground.*\n\nAs if on cue, a sharp, stabbing pain lanced through Izuku’s forearm. He gasped, clutching it. Beneath the skin, he saw a faint, brief flicker of that same blue-green light, like a trapped firefly. It faded quickly, leaving only the ache.\n\n*Observed: Energy feedback loop. My restorative abilities are attempting to heal cellular strain caused by One For All's residual instability, but the power itself reacts defensively. Inefficient. Dangerous.* Rimuru’s tone shifted, becoming more focused, urgent. *Izuku Midoriya. We need to establish a stable mental link. Direct communication is inefficient and taxing for you. May I attempt deeper synchronization?*\n\n“D-deeper?” Izuku stammered, the fear spiking again. “What does that mean? Are you going to… take over?” Images of body-snatching villains flashed through his mind.\n\n*Negative!* Rimuru’s response was swift and firm, carrying a surprising weight of sincerity. *Assumption of direct control is undesirable and currently impossible without catastrophic damage to your psyche and this fragile fusion. My core is embedded within One For All; separation is currently non-viable. Synchronization means shared awareness, streamlined communication, potentially coordinated energy management. Think of it as… opening a secure channel. I cannot act without your will, but I can perceive and advise. It is necessary for our mutual survival and understanding.*\n\nIzuku took shaky breaths, trying to calm his racing heart. The pain in his arm was a stark reminder of the danger. The slime secretion, the voice… it was undeniable. This being, Rimuru, was part of him now. Hiding from it wouldn’t help. All Might’s words echoed: *It’s like a torch, passed from one person to another to fight the darkness.* Was this… part of that darkness? Or something else entirely? Rimuru hadn’t attacked; he’d analyzed, explained, and expressed concern for *his* body.\n\n“O-okay,” Izuku whispered, closing his eyes tightly. “Do it. Synchronize.”\n\n*Acknowledgement. Initiating Neural Synchronization Protocol. Warning: Initial contact may cause disorientation.*\n\nThere was no sound, no flash. Instead, Izuku’s perception *shifted*. It was like suddenly having a second set of senses layered over his own, but inward-focused. He *felt* the vast, swirling ocean of One For All, a tempest of raw, inherited power. And nestled within its heart, like a brilliant, multifaceted gemstone radiating cool, calming light, was Rimuru’s core. Tendrils of blue-green energy, gentle yet persistent, extended from the core, trying to weave themselves into the raging golden currents of OFA, soothing frayed edges, reinforcing weak points, but meeting resistance.\n\n*Perception established. This is… remarkable.* Rimuru’s voice wasn’t just in his head now; it was *part* of his internal landscape, calm and observing. *The complexity of One For All… it carries echoes. Seven, no, eight distinct signatures intertwined with the core power. Vestiges of past wielders. And the instability… it’s not just new-user strain. The dimensional collision created microfractures in its energetic matrix. My presence is acting as a… patch, but a temporary one.*\n\nIzuku could *see* it in his mind’s eye – the golden power riddled with hairline cracks of chaotic purple and green energy, the blue-green light of Rimuru sealing them, but new cracks appearing elsewhere. It was a constant, delicate repair job. “Is… is that why I hurt?” he thought, the communication effortless now.\n\n*Affirmative. The power leaks cause cellular stress. My regeneration counters it, but it’s a reactive measure, not a cure. Furthermore…* Rimuru’s focus shifted. *My core isn’t just patching; it’s integrating. Analyzing. The fusion is creating… mutations.*\n\n“Mutations?” Dread pooled in Izuku’s stomach.\n\n*Accessing passive skills. [Magic Sense] online. Range limited to host physiology and immediate vicinity. [Analyze and Assess] online. Scanning…* Izuku felt a cool, analytical wave sweep through him. *Host biology exhibits enhanced cellular regeneration baseline, approximately 300% above human normal, fueled by my slime essence. Skeletal and muscular density show slight increase, likely adaptation to OFA’s potential. Neural pathways… fascinating. Increased processing speed and sensory acuity detected. Synergy potential with One For All’s physical enhancement is significant. However…*\n\n“However?” Izuku prompted nervously.\n\n*However, the fusion has unlocked latent aspects of *my* capabilities within the OFA matrix. Specifically, the Predator skill tree – Absorption, Mimicry, Isolation. They are dormant but… integrated. Accessible, theoretically, through One For All’s conduit: your body.*\n\nIzuku’s mind reeled. Absorption? Mimicry? Those sounded terrifyingly powerful… and potentially monstrous. “Can I… control them?”\n\n*Unknown. Theoretical activation requires significant energy expenditure and conscious intent, likely channeled *through* One For All. Risk of uncontrolled manifestation exists, especially under stress. Caution is paramount.*\n\nBefore Izuku could process this further, the door to the infirmary swung open. All Might stood there, still in his skeletal form, his face etched with deep worry that softened into profound relief when he saw Izuku awake. “Young Midoriya!” He hurried to the bedside, his large hand gently resting on Izuku’s shoulder. “Thank goodness. How are you feeling?”\n\n“A-All Might!” Izuku tried to sit up again, managing it this time with a grunt of effort, supported by the hero. “I’m… okay. Tired. Sore.” He glanced nervously at Recovery Girl, who gave him a knowing look but remained silent, observing.\n\n“You gave me quite the fright, my boy,” All Might said, his voice low and earnest. “That spatial anomaly… I’ve never felt anything like it. Did it… did it affect the transfer?” His blue eyes searched Izuku’s face, filled with concern not just for the boy, but for the legacy he carried.\n\n*Caution advised,* Rimuru’s voice was a cool current in their shared mindscape. *Disclosure of my presence carries significant risk. Social stigma, fear of possession, potential designation as a villain or security threat. Recommend limited information sharing until greater understanding and control are achieved.*\n\nIzuku swallowed hard. He hated lying to All Might, his idol, his mentor. But Rimuru’s points were chillingly valid. What would they do if they knew a self-proclaimed (former) Demon Lord was fused with One For All inside him? Expulsion? Imprisonment? Experimentation? The thought made him feel sick.\n\n“I… I don’t know, All Might,” Izuku stammered, looking down at his hands. “When the energies hit… it felt… wrong. Like something got mixed in. The power feels… different. Bigger? But… unstable.” That much was true. “And… I’ve been feeling… strange sensations. Like… coolness. Inside.”\n\nAll Might’s brow furrowed deeply. “Strange sensations? Different how? Recovery Girl mentioned unusual bio-signatures.” He looked at the nurse.\n\n“His cellular activity shows patterns inconsistent with standard quirk exhaustion or OFA integration,” Recovery Girl confirmed. “There’s a regenerative component I can’t identify. Like accelerated healing, but… foreign. And his energy readings fluctuate wildly, even at rest.”\n\nAll Might squeezed Izuku’s shoulder gently. “We’ll figure this out, young Midoriya. U.A. has the best resources. Nezu is already investigating the spatial tear. For now, focus on rest. Your body has undergone an immense ordeal. The important thing is that you’re alive, and One For All *is* within you. We’ll handle the rest, step by step.” His smile was reassuring, but Izuku could see the deep worry in his eyes.\n\n“Th-thank you, All Might,” Izuku mumbled, guilt twisting inside him. He was keeping a world-shattering secret from the person who trusted him most.\n\n*Survival necessitates discretion,* Rimuru reiterated. *Our priority must be understanding and controlling this fusion. Revealing me prematurely could endanger you and compromise our ability to fix this. We are bound, Izuku Midoriya. For better or worse, our fates are intertwined. Cooperation is our only viable path.*\n\nIzuku took a shaky breath. *Okay. Okay. We cooperate. We stay hidden. We learn to control… this.* He directed the thought firmly towards the presence within. *But no taking over. No using powers without me knowing. Deal?*\n\nA pulse of agreement resonated from the core within OFA. *Deal. Mutual survival pact established. Primary objective: Stabilize fusion, prevent host biological degradation, understand and control merged capabilities. Secondary objective: Investigate cause of dimensional breach, assess potential threats.*\n\nIt felt like signing a contract with a force of nature. Terrifying, but also… strangely grounding. He wasn’t alone in this chaos.\n\n***\n\nDays blurred into a haze of rest, tests, and awkward explanations. Izuku was kept in the infirmary under Recovery Girl’s watchful eye. All Might visited daily, his concern a constant, warm presence. Nezu popped in once, his beady eyes missing nothing, asking pointed questions about the sensations Izuku experienced. Izuku stuck to the script: feeling the power differently, strange internal coolness, instability. He mentioned nothing of voices, slime, or Demon Lords.\n\nMeanwhile, the silent partnership with Rimuru deepened. The mental link became second nature, a constant background hum of shared perception. Rimuru was an endless source of analysis:\n\n*Observing Recovery Girl's Quirk: \"Heal\". Accelerates natural healing via lip contact. Requires significant user stamina and patient biological resources. Inefficient compared to [Ultra-Speed Regeneration], but impressive for a non-magical biological ability. Note: Her energy expenditure is high; visible fatigue post-use.*\n\n*Analyzing All Might's residual energy signature: Severely depleted. Critical damage to organic energy conversion system. Current form is baseline human sustained by sheer willpower and residual OFA embers. Heroic sacrifice evident. Risk of complete systemic failure high without intervention. Current fusion status prevents safe assistance.*\n\n*Scanning U.A. infrastructure: Advanced energy shielding detected around perimeter. Likely anti-intruder and quirk-dampening fields. Security systems are multi-layered: electronic, biometric, motion-sensor, and… biological? Interesting. Several non-human energy signatures detected among staff.*\n\nIzuku absorbed it all, his analytical mind latching onto the data even through his fatigue and fear. Rimuru’s perspective was alien, viewing Quirks as fascinating biological/magical phenomena, heroes and villains through the lens of power dynamics and governance. It was overwhelming but undeniably enlightening.\n\nThe physical manifestations became harder to hide. The cool, slimy sensation would flare up randomly – when he got flustered talking to All Might, when Nezu’s gaze felt too penetrating, during a particularly painful blood draw. Once, a small scrape on his knuckle from fumbling a glass of water vanished in seconds, leaving only a faint blue-green sheen that dissipated almost instantly. He caught Recovery Girl frowning at the spot later.\n\n*Instinctive activation of [Lesser Regeneration],* Rimuru supplied. *Stress response. Requires conscious suppression.*\n\n“How?” Izuku thought desperately.\n\n*Focus. Internalize. Visualize containment. Your will governs the merged energies. Command the slime essence to remain dormant unless consciously invoked.*\n\nIt was like trying to hold back a sneeze or suppress a flinch. He practiced constantly, lying in bed, focusing inward, visualizing a shield around the cool, slimy presence within him, forcing it to settle. It was exhausting mental work on top of his physical recovery.\n\nFinally, after what felt like an eternity, Recovery Girl declared him stable enough for light activity, albeit confined to the school grounds and under supervision. “No training, Midoriya,” she warned sternly, wagging a finger. “Light walks only. Your body is still integrating that power, and whatever *else* is going on. Pushing it could be catastrophic.”\n\nRelief washed over Izuku. Getting out of the infirmary felt like escaping a gilded cage, even if the larger prison was his own transformed body. All Might walked with him, a comforting, albeit anxious, presence.\n\n“It’s good to see you up and about, young man,” All Might said, his voice warm. “Take it slow. The training ground is off-limits, but perhaps a walk through the courtyard? Some fresh air might do you good.”\n\nThey walked in companionable silence for a while, the spring sun warm on their faces. U.A. felt different now. The towering buildings, the distant sounds of other students training – it all seemed sharper, more vibrant. Izuku realized it was Rimuru’s influence; his [Magic Sense], though limited, heightened Izuku’s passive awareness. He could feel the faint hum of power from distant quirks, the solidity of the earth beneath his feet, the flow of air currents.\n\n*[Magic Sense] detects anomalous energy signature,* Rimuru’s alert cut through his observation. *Approximately 50 meters ahead. Faint spatial distortion. Residual energy matching the beach breach.*\n\nIzuku froze, his blood running cold. “All Might… do you feel that?” he whispered, eyes scanning ahead. They were approaching a less-frequented side courtyard near one of the support department’s storage sheds.\n\nAll Might’s expression sharpened instantly, his hero instincts kicking in despite his weakened state. “Feel what, young Midoriya?”\n\nBefore Izuku could explain, a small, jagged tear, no larger than a coin, flickered into existence near the base of the shed. It spat out a brief burst of chaotic purple light and something small, dark, and metallic that clattered onto the concrete path before the rip snapped shut with a faint *pop*.\n\n“What was that?!” All Might moved swiftly, putting himself slightly ahead of Izuku, his body tense.\n\n*Object analysis: Inert metallic fragment. Composition: Iron alloy, traces of chromium. Origin: Unknown dimension. Residual spatial energy fading rapidly. Micro-portals. The instability is spreading,* Rimuru’s voice was grim.\n\nIzuku pointed a shaking finger. “There! By the shed! Something fell out!”\n\nAll Might strode forward, peering at the small, twisted piece of metal. He pulled out a handkerchief and carefully picked it up. “Hmm. Doesn’t match any known support gear or construction material here.” He looked around, his gaze sweeping the area. “No other disturbances. But you sensed it, young Midoriya? Before it appeared?”\n\n“I… I felt a weird… pressure? Like the air was buzzing,” Izuku lied, his heart pounding. Rimuru’s warning about disclosure echoed loudly. “Just for a second.”\n\nAll Might studied him, then the fragment. “Your connection to One For All… perhaps it’s making you sensitive to the residual energies from the breach. This is concerning. I must report this to Nezu immediately.” He pocketed the fragment carefully. “Come. Let’s get you back inside. It seems the danger isn’t entirely past.”\n\nThe incident left Izuku shaken. The breach wasn’t isolated. It was spreading. And he, fused with Rimuru, was apparently a sensor for it. The weight of secrecy felt heavier than ever.\n\n***\n\nThree days later, deemed sufficiently recovered (though still under strict ‘no quirk use’ orders), Izuku was allowed to observe a basic heroics class. Not participate, just watch from the sidelines under Aizawa’s watchful eye. It was agony and ecstasy. Seeing his classmates – Uraraka’s effortless floating, Iida’s incredible speed, Kirishima’s hardening – filled him with longing and frustration. He wanted to be out there *so badly*.\n\nBakugo, naturally, was a whirlwind of explosive power and aggression during a simple capture drill. His movements were sharp, brutal, efficient. He pinned Sero against a training dummy with a concussive blast, the force rattling the observation windows where Izuku stood.\n\n“Pathetic!” Bakugo snarled, turning away, already looking for the next target. His crimson eyes scanned the training ground and locked onto Izuku in the observation booth. A sneer twisted his lips. “Hah! Still benched, Deku? What’s the matter, your precious All Might’s hand-me-down quirk finally break you for good? Can’t handle even *watching* real heroes work?”\n\nThe taunt stung, but worse was the sudden spike of anger and indignation that flared *within* Izuku, hot and fierce. It wasn’t entirely his own.\n\n*Hostile entity identified: Katsuki Bakugo. Quirk: \"Explosion\" – nitroglycerin-like sweat detonation. Personality: Aggressive, competitive, holds significant animosity towards host. Threat level: Moderate. Emotional response: Anger. Suggestion: Ignore provocation. Engagement offers no tactical advantage.*\n\nEasier said than done. Bakugo’s words always dug deep. The hot anger mixed with Izuku’s own frustration and helplessness. He clenched his fists, looking down. As he did, his gaze fell on a broken training dummy near the edge of the field. It was one Bakugo had just obliterated – a tangled mess of synthetic muscle fibers, shattered plastic, and exposed metal struts.\n\nAnd in that moment, consumed by Bakugo’s taunt and his own pent-up powerlessness, Izuku felt it – a *pull*. Not emotional. Physical. A sudden, sharp hunger emanating from deep within his core, from the place where Rimuru’s essence was woven into One For All. It was a primal, insatiable urge directed straight at the shattered dummy.\n\n*Warning! Predator skill activation detected!* Rimuru’s mental shout was urgent. *Unconscious trigger! High stress! Suppress—!*\n\nBut it was too late. Izuku didn’t command it; it *happened*. His right hand shot out involuntarily, palm facing the broken dummy from twenty meters away. A stream of viscous, shimmering blue-green slime erupted from his palm, streaking across the distance faster than the eye could follow. It struck the dummy’s wreckage with a wet *splat*.\n\nTime seemed to freeze. Uraraka paused, mid-float. Iida skidded to a halt. Kirishima hardened instinctively. Bakugo whirled around, his sneer vanishing into stunned disbelief. Aizawa’s head snapped up from where he’d been grading, his capture weapon loosening slightly around his neck, his eyes wide and instantly alert, glowing red as Erasure activated on reflex – though it had no visible effect on the slime.\n\nThe blue-green substance didn’t just cover the dummy; it *engulfed* it. The broken plastic, the synthetic fibers, the twisted metal struts – they dissolved on contact, vanishing into the shimmering mass like sugar in hot water. In less than two seconds, the entire wreckage was gone. The slime pulsed once, glowing brighter, then snapped back towards Izuku like a rubber band, retracting into his palm and vanishing without a trace. Only a faint, quickly fading blue-green sheen on his skin remained.\n\nA profound silence descended on Gym Gamma. The only sound was the faint hum of the lights and Izuku’s own ragged, terrified breathing. He stared at his hand, then at the spot where the dummy had been. Nothing. Not even dust. Utterly erased.\n\nHe slowly lifted his gaze. Twenty pairs of eyes were locked onto him, filled with shock, confusion, and dawning fear. Uraraka’s hand was over her mouth. Iida looked like he’d seen a ghost. Kirishima’s hardened jaw was slack. Bakugo’s expression was pure, unadulterated fury mixed with utter bewilderment.\n\nAnd Aizawa. Aizawa’s eyes were no longer just alert; they were narrowed into dangerous slits, glowing red, fixed on Izuku with an intensity that felt like physical pressure. His capture scarf was taut. He didn’t say a word. He didn’t need to. The question hung heavy in the stunned silence, echoing in Izuku’s own petrified mind, amplified by Rimuru’s chillingly calm analysis:\n\n*Absorption complete. Materials: Synthetic polymer, carbon fiber, steel alloy. Minimal nutritional value. Predator sub-skill [Isolation] engaged automatically. No useful skills acquired. Threat assessment: Severe social and strategic compromise. Host status: Exposed.*\n\nIzuku stood frozen, his heart hammering against his ribs like a trapped bird. The secret was out. Not all of it, but enough. Enough to brand him a monster. Enough to shatter everything. The silence stretched, thick and suffocating, broken only by Bakugo’s low, dangerous growl.\n\n“What… the hell… was that, *Deku*?”"
                    "Chapter 3: Power Adjustment\n\nThe silence in Gym Gamma wasn't just the absence of sound; it was a physical weight pressing down on Izuku Midoriya. Twenty pairs of eyes, wide with shock, confusion, and burgeoning fear, were fixed solely on him. Uraraka looked like she might be sick. Iida was frozen mid-step, hand halfway to adjusting imaginary glasses. Kirishima’s hardened jaw hung slack. Todoroki’s heterochromatic gaze was unnervingly intense, dissecting him. And Bakugo… Bakugo’s face was a mask of pure, incandescent fury mixed with utter disbelief, his palms crackling faintly with suppressed explosions.\n\nBut the worst was Aizawa. Eraserhead’s eyes glowed an ominous red, his capture scarf taut with tension. His expression wasn't shocked; it was *dangerously* focused, the look of a predator who’d just identified a significant anomaly. He didn’t speak. He didn’t need to. The unspoken accusation hung in the air, thick and suffocating: *What are you?*\n\n*Host status: Critically compromised,* Rimuru’s voice cut through Izuku’s panic, its usual calm replaced by urgent analysis. *Social threat assessment: Severe. Immediate explanation required. Suggest plausible deniability.*\n\nPlausible deniability? How?! He’d just shot slime from his hand and dissolved a training dummy in front of his entire class and homeroom teacher!\n\n“M-Midoriya?” Uraraka’s voice trembled, breaking the awful silence. “What… what was that?”\n\nIzuku’s mouth opened and closed like a fish out of water. His brain scrambled, synapses firing wildly but producing only static. He could feel the phantom coolness where the slime had retracted, a constant, terrifying reminder. “I… I don’t… It wasn’t…!” he stammered, his voice barely a whisper.\n\n“*DON’T GIVE ME THAT BULLSHIT, DEKU!*” Bakugo roared, exploding forward, propelled by his quirk until he was mere feet away, his spiked hair practically vibrating with rage. He jabbed a finger towards the spot where the dummy had vanished. “You just *ate* it! Like some kind of fuckin’ monster! What kind of sick, hidden quirk is that?! Did All Might give you *that* too?!”\n\nThe accusation, so close to the terrifying truth, sent a fresh wave of panic through Izuku. “N-no! Kacchan, it’s not like that! It’s… it’s part of… One For All? Maybe?” The lie tasted like ash, but he had nothing else. “It… it acted on its own! I didn’t mean to!”\n\nAizawa finally moved. He deactivated Erasure, his eyes returning to their usual dark, tired state, though the intensity remained. He stepped forward, placing himself subtly between Bakugo and Izuku. “Bakugo, stand down.” His voice was low, flat, brooking no argument. Bakugo snarled but took a half-step back, fists clenched, smoke curling from his palms. Aizawa turned his gaze fully onto Izuku. “Midoriya. Explain. Now. What was that manifestation? It bore no resemblance to One For All as previously documented.”\n\nIzuku felt sweat bead on his forehead. Rimuru’s presence was a frantic hum in his mind, feeding him possible deflection points. *Stress-induced quirk mutation. Uncontrolled energy discharge. Unknown side effect of the beach incident.* None sounded believable.\n\n“I… I think… the dimensional tear?” Izuku forced out, latching onto the only known external factor. “When the energy hit me during the transfer… maybe it… changed something? Made One For All unstable? That felt… like a surge. An uncontrolled one. Like… like a backlash.” He kept his eyes fixed on Aizawa’s boots, unable to meet the man’s penetrating stare. “I’ve been feeling weird… instability… since then. Recovery Girl knows.”\n\nAizawa’s expression didn’t change, but Izuku felt the weight of his scrutiny deepen. “A ‘surge’ that manifests as an acidic or assimilative slime substance,” he stated flatly. “Unprecedented. And highly dangerous.” He glanced at the pristine spot of concrete. “That dummy is classified training equipment. Its destruction will be noted. Report to Principal Nezu’s office immediately after class. Dismissed.” He turned his attention back to the stunned class. “The rest of you, resume drills. Bakugo, control your temper or you’ll be running laps.”\n\nThe dismissal felt like a temporary reprieve from an executioner. Izuku stumbled out of the observation booth on shaky legs, the eyes of his classmates burning holes into his back. He could feel Bakugo’s furious glare like a physical brand. The walk to Nezu’s office was a blur of white corridors and mounting dread.\n\n*Analysis: Aizawa Shota is suspicious but pragmatic,* Rimuru observed, his mental voice regaining some composure. *He prioritizes immediate safety and information gathering over public accusation. Nezu will be far more probing. Recommend adhering to the ‘instability’ narrative. Disclose only the physical sensations – energy fluctuations, internal coolness. Deny conscious control over the slime manifestation. Attribute it entirely to OFA’s mutated state triggered by high stress.*\n\n“They saw it, Rimuru!” Izuku thought back frantically. “They saw me shoot slime and dissolve something! How can I just deny control? They’ll think I’m lying! Or worse, that I’m dangerous and hiding it!”\n\n*Admitting conscious control implies intent and capability. That elevates the threat level significantly. Claiming a stress-induced, *unconscious* backlash paints it as a symptom of a problem, not a deliberate act. It makes you a victim of circumstance, requiring observation and help, rather than a potential villain needing containment. It’s the least damaging narrative available.*\n\nIt felt cowardly. Dishonest. But the image of being locked away, studied like a lab specimen, or worse, expelled for being a monster, was paralyzing. He had to play the victim, even if it churned his stomach. He reached Nezu’s office door, took a shuddering breath, and knocked.\n\n“Come in, Midoriya-kun!” Nezu’s cheerful voice chimed from within.\n\nThe principal sat behind his large desk, a steaming cup of tea before him. All Might was also there, perched awkwardly on a too-small chair, his skeletal face etched with deep concern that deepened further when he saw Izuku.\n\n“Young Midoriya! Are you alright? Aizawa informed me… something happened during the observation?” All Might stood, his large hand hovering anxiously.\n\nNezu’s beady black eyes missed nothing. “Indeed! Quite the unexpected display! Please, sit down, Midoriya-kun. Tell us everything, in your own words.”\n\nIzuku sank into the offered chair, feeling like a bug under a microscope. He recounted the events, sticking rigidly to Rimuru’s script: Bakugo’s taunt, his own rising frustration and helplessness, the sudden, overwhelming surge of power he couldn’t control, the involuntary expulsion of the “strange energy” that dissolved the dummy. He emphasized the instability he’d felt since the beach, the internal coolness, the fatigue Recovery Girl had noted.\n\n“So, you’re saying this… substance… is an uncontrolled manifestation of One For All, mutated by the dimensional energy?” Nezu clarified, steepling his paws.\n\n“Y-yes, sir,” Izuku nodded, avoiding eye contact. “It felt… like the power backfired. Like it was lashing out because I couldn’t… contain it properly.” That part, at least, held a kernel of truth.\n\n“And you have no conscious ability to produce or control this slime-like energy?” Nezu pressed, his tone deceptively light.\n\n“No, sir. It just… happened. Like a spasm. I couldn’t stop it.” Izuku clenched his hands in his lap to hide their trembling.\n\nAll Might placed a reassuring hand on his shoulder. “We knew the transfer was affected, young Midoriya. This… this is just a more visible manifestation of that instability. We’ll help you understand it, control it.”\n\nNezu sipped his tea thoughtfully. “Visible and destructive. This complicates things significantly, All Might. Uncontrolled energy discharges of unknown composition and effect are a serious safety hazard, both for Midoriya-kun and those around him.” He turned his gaze back to Izuku. “Your training regimen requires immediate adjustment. Until we understand this mutation and you demonstrate control, *all* quirk usage outside controlled, supervised environments is strictly prohibited. Including passive manifestations like enhanced strength or speed. We cannot risk another… incident.”\n\nIzuku’s heart sank. No training? No using OFA at all? How could he become a hero like this? “B-but sir, how will I learn to control it if I can’t practice?”\n\n“Under supervision, Midoriya-kun. Extreme supervision,” Nezu stated firmly. “Starting tomorrow, your afternoons will be spent in Gym Beta with All Might and myself. We will conduct controlled tests to map the extent of this mutation, its triggers, and potential containment methods. Consider it a specialized remedial course.” He offered a small smile that didn’t quite reach his eyes. “Safety first! For everyone.”\n\nThe meeting ended with Izuku feeling more confined than ever. He was grounded, his powers locked down, under constant scrutiny, and living a lie. The walk back to the dorms was solitary and heavy.\n\n*Regrettable, but necessary,* Rimuru consoled, though his tone held a hint of frustration. *Suppression limits our ability to understand and master the fusion. However, the supervised sessions present an opportunity. Controlled environment, expert observers – ideal for gathering data on our merged capabilities without public exposure. We must utilize this.*\n\n“How? They’ll be watching everything!”\n\n*Precisely. We show them what they expect to see – instability, uncontrolled surges. But simultaneously, *we* learn. I will analyze every fluctuation, every sensation. We begin mapping the boundaries of this fusion.*\n\n***\n\nThe next afternoon found Izuku standing on the pristine, reinforced floor of Gym Beta. All Might stood nearby, looking uncharacteristically serious and concerned. Nezu observed from a shielded control booth high above, monitors displaying various bio-readouts fed from sensors attached to Izuku’s gym uniform.\n\n“Alright, young Midoriya,” All Might said, his voice gentle but firm. “Let’s start simple. No power activation. Just… try to stand still. Focus on feeling the energy within you. Nezu wants baseline readings without any external stress.”\n\nIzuku nodded, closing his eyes. He focused inward, past the nervous flutter in his stomach, seeking the churning sea of power within. One For All felt like a contained storm, vast and powerful but turbulent, its golden light shot through with streaks of chaotic purple and green – the lingering scars of the dimensional collision. Woven through it, like a lattice of cool, blue-green light, was Rimuru’s core, constantly emitting gentle tendrils that tried to soothe the raging energy, patching microfractures only for new ones to appear.\n\n*Beginning passive scan,* Rimuru announced. *Monitoring bio-signatures: heart rate elevated due to stress, not energy. Brainwave patterns show heightened beta activity – anxiety. OFA energy baseline: fluctuating between 3% and 8% capacity without conscious draw. Instability index: High. My core output: Stable, regenerative field active at minimal sustainment level.*\n\n“Feeling anything, young man?” All Might asked.\n\n“J-just… the usual buzz, sir. Like static. And… the cool feeling inside.” Izuku reported honestly.\n\n*Good. Accurate reporting builds trust within their expected parameters,* Rimuru noted.\n\nNezu’s voice crackled over the intercom. “Baseline established. Minor fluctuations consistent with Recovery Girl’s reports. Proceed to Stage One, All Might. Minimal physical exertion. Light calisthenics.”\n\nAll Might guided Izuku through simple stretches, then light jogging in place. Izuku focused on moving naturally, suppressing any instinctive urge to tap into OFA for ease. Sweat beaded on his forehead from the effort of pure physical exertion combined with the mental strain of constant suppression.\n\n*Observe: OFA energy reacts to physical strain,* Rimuru commented. *Micro-surges attempt to enhance muscle fiber activation, but are dampened by your conscious suppression and the instability. Inefficiency causes localized cellular stress points. My regeneration counters it automatically. See the faint bio-luminescent signature on your inner arm?*\n\nIzuku glanced down subtly. Sure enough, where his sleeve had ridden up, a patch of skin glowed faintly blue-green for a second before fading. He quickly pulled the sleeve down. “Feeling… a bit warm, All Might!” he called out, hoping to cover the tell.\n\n“Understood! Keep going, steady pace!” All Might encouraged.\n\n*Stage Two: Low-level stress simulation,* Nezu announced. A section of the floor slid open, revealing a simple obstacle course – low hurdles, a balance beam, a rope climb. “Navigate the course, Midoriya-kun. Focus on agility and balance. No quirk augmentation. Maintain current exertion level.”\n\nIzuku took a breath and started. He cleared the hurdles awkwardly, wobbled on the beam, and struggled slightly with the rope. It was frustratingly slow compared to what he knew he *could* do with just a fraction of OFA. Halfway through, his foot slipped slightly on the beam. Instinctively, a tiny spark of OFA flared in his leg to correct his balance.\n\n*Suppress!* Rimuru commanded.\n\nIzuku clamped down hard, forcing the energy back. He wobbled violently, arms windmilling, and barely avoided falling. The effort left him panting.\n\n*OFA surge detected: 1.5% localized to gastrocnemius muscle. Suppressed manually. Cellular stress detected. Regeneration activated subcutaneously.* Rimuru reported clinically. *The suppression is causing micro-tears in the muscle fibers. Inefficient and damaging long-term.*\n\n“Everything alright, young Midoriya?” All Might called, looking concerned.\n\n“Y-yeah! Just clumsy!” Izuku gasped, forcing a smile. He finished the course, his legs trembling slightly from the conflicting forces within.\n\n*Stage Three: Emotional stress test,* Nezu’s voice held a hint of… curiosity? A screen descended from the ceiling. “Midoriya-kun, please watch this footage.”\n\nThe screen flickered to life, showing a news report about a villain attack – a hostage situation. The villain was menacing, the civilians terrified. Izuku’s hero instincts screamed. He leaned forward, fists clenching unconsciously. He *wanted* to help. He *needed* to act. The familiar drive to save people surged.\n\n*Emotional spike detected: Heroic drive, empathy, urgency. OFA core resonance increasing! 10%... 15%... Suppress, Izuku!* Rimuru’s warning was sharp.\n\nIzuku gritted his teeth, trying to force the rising power down. It was like holding back a flood with his bare hands. He felt the energy crackle under his skin, saw faint golden sparks flicker around his clenched fists. Simultaneously, the coolness inside surged in response, a blue-green sheen spreading visibly up his neck.\n\n“Midoriya! Control it!” All Might urged, taking a step closer.\n\n*Conflict: Suppression causing internal feedback loop!* Rimuru’s analysis was frantic. *OFA instability spiking! My regeneration is overcompensating! Risk of uncontrolled manifestation!*\n\nIzuku gasped, feeling a terrifying pressure build in his right arm. It wasn't just energy; it felt like something was trying to *reshape*. The image of the training dummy dissolving flashed in his mind. Panic seized him. *No! Not here! Not now!*\n\nHe focused every ounce of his will, not just on suppressing OFA, but on containing the slimy, shifting sensation crawling under his skin. He visualized a solid barrier, a vault slamming shut. He squeezed his eyes shut, trembling violently. “S-stop… please stop…” he whispered, not sure who he was pleading with – the power, Rimuru, or himself.\n\nSlowly, agonizingly, the pressure receded. The sparks faded. The blue-green sheen vanished. Izuku slumped to his knees, panting, drenched in cold sweat. He hadn’t manifested anything, but the near-miss had been terrifyingly close.\n\nSilence filled the gym. All Might knelt beside him, a hand on his back. “Easy, young man. Easy. You held it back. That’s progress.”\n\nFrom the booth, Nezu’s voice was thoughtful. “Fascinating. The mutation reacts strongly to emotional catalysts, particularly the drive to act heroically. The secondary energy – the ‘coolness’ – appears to be a regenerative counterbalance, but becomes volatile under duress. Suppression is possible but physically taxing and potentially damaging. We have much to learn. Session concluded for today, Midoriya-kun. Rest.”\n\nIzuku stumbled out of the gym, supported by All Might, feeling utterly drained and demoralized.\n\n***\n\nThe next few days followed a similar pattern: tense, monitored sessions in Gym Beta, filled with careful tests, near-misses, and exhausting suppression. The constant strain was taking its toll. Izuku moved through the dorms like a ghost, jumping at shadows, flinching when classmates got too close. He avoided the common room, taking meals in his room. The curious and wary glances followed him everywhere.\n\nOnly one person seemed actively hostile rather than just confused: Bakugo. He watched Izuku like a hawk, his crimson eyes narrowed with suspicion. He didn’t confront him directly again, but his muttered comments were sharp and cutting. “Freak.” “Monster.” “Walking biohazard.” They stung, feeding Izuku’s isolation and fear.\n\nOne evening, alone in his room after another grueling session, Izuku finally broke down. The stress, the secrecy, the constant fear of exposure, the weight of the lie – it all crashed down. He sat on his bed, shoulders shaking with silent sobs. *I can’t do this, Rimuru. I’m going to crack. Someone’s going to get hurt. Bakugo’s right… what if I am a monster?*\n\n*Emotional distress acknowledged,* Rimuru’s voice was softer than usual, lacking its usual analytical edge. *Bakugo Katsuki operates on aggression and perceived threat. Your mutation challenges his worldview and his perceived superiority. His hostility is predictable, but irrelevant to our survival. You are not a monster, Izuku Midoriya. You are a host coping with an unprecedented interdimensional accident. The ‘monster,’ as you might define it, would be me.*\n\nIzuku sniffled, wiping his eyes. “You’re not a monster, Rimuru. You helped me. You’re trying to control it too.”\n\n*Perception is subjective. In my world, I was called a monster many times before earning the title of Demon Lord. Perhaps Bakugo is not entirely wrong in his crude assessment, from his limited perspective.*\n\n“Demon Lord…” Izuku murmured, the title sending a shiver down his spine despite his defense. He’d avoided asking, afraid of the answer. But the isolation and the weight of their shared secret made the question bubble up. “Rimuru… you said you were a Great Demon Lord? A ruler? What… what does that even mean? How did… how did a slime become that?” The absurdity of the question almost made him laugh through his tears.\n\nThere was a pause, a sense of introspection within their shared mindscape. *A long story, Izuku Midoriya. Summarized: I was once human. A salaryman named Satoru Mikami, stabbed in the street. I died. I woke up as a slime in a cave, blind and deaf, in a world governed by magic, monsters, and warring nations. I named myself Rimuru Tempest.*\n\nIzuku’s breath hitched. *Reincarnated? As a slime?* It sounded like the plot of one of Mineta’s light novels.\n\n*Affirmative,* Rimuru continued. *I possessed unique skills – [Predator] to absorb and gain abilities, [Great Sage] for analysis and guidance. I befriended monsters – a mighty Storm Dragon, Veldora, sealed in my cave. I freed him, earned his blessing. I sought to create a haven where monsters could live without fear, a place called Jura Tempest Federation. It grew. We faced threats – greedy humans, scheming Demon Lords, otherworldly invaders. I absorbed powers, evolved. From Slime to Demon Slime, to True Demon Lord. I gained strength to protect my people, my nation.* His mental voice held a complex mix of pride, nostalgia, and a deep, underlying sorrow. *I ruled not through fear, but through mutual respect and strength used for defense. But power attracts challenges. Constant vigilance. Constant battles. It was… a heavy mantle.*\n\nIzuku listened, utterly captivated despite himself. The story was fantastical, epic, terrifying. A slime building a nation? Fighting Demon Lords? Absorbing powers? It explained so much about Rimuru’s analytical nature, his power, his calmness under pressure. It also explained the terrifying potential lurking within their fusion. “So… the Predator skill… the absorption… that’s how you…?”\n\n*Yes. [Predator], and its evolved forms, allowed me to analyze, mimic, and acquire the skills and attributes of what I consumed – monsters, magic, even weapons. It’s a core part of my being, now tangled with One For All within you. That’s what manifested in the gym – a base-level application of Isolation and Absorption.*\n\n“And you were… respected? A leader?” Izuku couldn’t reconcile the terrifying Demon Lord image with the calm presence helping him.\n\n*By my people, yes. By allies. By enemies… fear and respect often intertwine. I did what was necessary to protect what was mine. Sometimes, it required overwhelming power. Sometimes, ruthlessness. The title ‘Demon Lord’ was earned, not given lightly.* Rimuru paused. *Does this knowledge frighten you more, Izuku Midoriya?*\n\nIzuku thought about it. It *was* frightening. The sheer scale of Rimuru’s power and past was daunting. But… “You’re helping me. You haven’t tried to take over. You protected me when that power lashed out. You… you care about stabilizing this, about not hurting anyone.” He took a deep breath. “You might have been a Demon Lord, but you don’t feel like a villain. You feel… like a person. A really powerful, reincarnated, slime person who’s stuck with me.”\n\nA pulse of genuine amusement, warm and unexpected, resonated from Rimuru’s core. *An accurate, if peculiar, summation. Thank you, Izuku. The feeling is… mutual. You possess a heroic spirit remarkably similar to some of my most trusted allies. Perhaps this fusion, however chaotic, isn’t entirely without potential.*\n\nThe shared moment of understanding, of vulnerability acknowledged, eased some of the crushing weight on Izuku’s shoulders. He wasn’t alone. He had an ally, a terrifyingly powerful one with a bizarre past, but an ally nonetheless. They were in this together.\n\n***\n\nThe supervised sessions continued, a grueling routine of careful probing and near-constant suppression. One afternoon, Nezu introduced a new element: low-level impact testing. Izuku was to stand still while a small, weighted ball (soft, rubber-coated) was fired at his shoulder from a pneumatic launcher at increasing velocities. The goal was to see if his subconscious would activate any defensive aspect of his mutated quirk under sudden threat.\n\n“Begin Level One: Minimal velocity,” Nezu announced.\n\n*Thwump.* The ball hit Izuku’s shoulder with a light tap. Nothing happened. No OFA surge, no slime. Just a slight sting.\n\n“Level Two.”\n\n*Thwump.* A firmer impact. Izuku braced, consciously holding back any reaction. Still nothing.\n\n“Level Three.”\n\n*Thwump.* Harder. Izuku grunted slightly. He felt the faintest flicker of OFA energy instinctively gathering at the impact point, like a muscle tensing, but he suppressed it instantly. A tiny point of warmth flared under his skin where the ball hit, quickly soothed by a wave of coolness.\n\n*Observe: OFA defensive reflex triggered and manually suppressed. Micro-damage instantly regenerated,* Rimuru reported.\n\n“Interesting. Minimal reflexive energy gathering, effectively suppressed. Proceeding to Level Four,” Nezu said.\n\nLevel Four was significantly faster. *THWACK!* The ball slammed into Izuku’s shoulder with enough force to make him stagger back a step. Pain flared. Instinct screamed. OFA roared to life in his shoulder, a golden flare of power surging to absorb the impact. Simultaneously, the cool slime essence surged, trying to heal the bruising instantly.\n\n*Suppress!* Rimuru commanded, but the dual surge was overwhelming.\n\nIzuku clamped down with all his might. He felt the conflicting energies collide *inside* his shoulder. There was a sickening *pop* followed not by pain, but by a bizarre, numb tingling. He looked down.\n\nHis shoulder… *rippled*. The fabric of his gym shirt distorted as the shape beneath it shifted. For a split second, the outline wasn't human muscle and bone; it looked softer, more amorphous, glowing faintly blue-green beneath the material before snapping back to normal with an almost audible *slurp*.\n\n“Midoriya?!” All Might was at his side instantly.\n\nIzuku stared at his shoulder, horrified. He flexed it. It felt… normal. But he’d *seen* it. Felt it.\n\n*Temporary localized shapeshift,* Rimuru diagnosed, his voice tight. *Instinctive activation of [Mimicry] sub-skill triggered by impact and the conflicting suppression of OFA and regeneration. It attempted to absorb the kinetic energy by becoming malleable. Suppression forced reversion.*\n\n“I-I’m okay!” Izuku stammered, pulling his shirt collar to look at the skin. It was unmarked. “Just… a weird spasm! The energy… it surged weirdly!”\n\nAll Might looked unconvinced. Nezu’s voice crackled, sharper than usual. “Report the sensation precisely, Midoriya-kun. What did you feel?”\n\n“L-like… it went numb? And tingly? Like my shoulder fell asleep really fast and then woke up?” Izuku lied, his heart hammering. Shapeshifting? He could *shapeshift*? The implications were horrifying.\n\n*Analysis: The fusion is evolving,* Rimuru stated, his mental voice grave as Nezu ordered the session paused for review. *The forced suppression under stress isn't just containing the powers; it’s forcing them to interact in new, unpredictable ways. The [Mimicry] activation wasn't solely mine; it was facilitated by One For All’s energy conduit. The mutation is unlocking latent capabilities within the OFA matrix itself.*\n\nIzuku felt cold dread seep into his bones. “What does that mean?”\n\n*It means One For All isn't just damaged, Izuku. It’s mutating. Adapting. Integrating aspects of *my* core skills – Regeneration, Predator, Mimicry, Spatial Sense – into its own structure. It’s not just us sharing space anymore. Our powers are merging, creating something… new. Something potentially far more powerful, but also far more volatile and dangerous than either of us alone.*\n\nAs Izuku sat in the recovery area, All Might fretting nearby and Nezu reviewing the footage frame-by-frame, the weight of Rimuru’s words settled over him. One For All, the sacred torch passed down to fight evil, was changing. It was becoming something else. Something that could heal and absorb and shapeshift. Something born of a hero’s spirit and a Demon Lord’s essence. The path ahead wasn't just about control anymore. It was about understanding what kind of power, what kind of *hero*, was being forged in the chaotic fire of their fusion. And the thought was as exhilarating as it was terrifying."

        document.getElementById('nextBtn').addEventListener('click', () => {
